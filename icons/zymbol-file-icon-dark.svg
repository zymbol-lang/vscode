<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background - dark -->
  <rect width="100" height="100" fill="#2d2d2d" rx="8"/>

  <!-- .zy text with brighter gradient for dark theme -->
  <defs>
    <linearGradient id="textGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5eeee4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#54c0ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ba696;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- .zy text -->
  <text x="50" y="65"
        font-family="monospace, Consolas, 'Courier New'"
        font-size="42"
        font-weight="bold"
        fill="url(#textGradientDark)"
        text-anchor="middle">.zy</text>
</svg>
